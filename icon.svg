  <polyline points="336,120 306,144 336,168 306,192 336,216 306,240 336,264 306,288 336,312 306,336 336,360" fill="none" stroke="#2dd4bf" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- copper drill: body + flute + 118° point -->
  <path d="M232 70 H280 V352 L256 394 L232 352Z" fill="url(#cu)"/>
  <path d="M232 110 L280 150 M232 170 L280 210 M232 230 L280 270 M232 290 L280 330" stroke="#7a3a12" stroke-width="9" stroke-linecap="round" opacity=".75"/>
