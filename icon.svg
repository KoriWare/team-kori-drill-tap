  <path d="M86 96 H176 L176 120 L206 144 L176 168 L206 192 L176 216 L206 240 L176 264 L206 288 L176 312 L206 336 L176 360 L176 416 H86Z" fill="#14212a"/><path d="M426 96 H336 L336 120 L306 144 L336 168 L306 192 L336 216 L306 240 L336 264 L306 288 L336 312 L306 336 L336 360 L336 416 H426Z" fill="#14212a"/>
