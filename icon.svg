  <path d="M426 96 H336 L336 120 L306 144 L336 168 L306 192 L336 216 L306 240 L336 264 L306 288 L336 312 L306 336 L336 360 L336 416 H426Z" fill="url(#hatch)" stroke="#3a4c57" stroke-width="5" stroke-linejoin="round"/>
